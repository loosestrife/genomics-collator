<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Barnyard</title>
    <style>
      body {
        background-image: url("GBbackgroundimage.jpg");
        background-size: cover;
        background-attachment: fixed;
        margin: 0;
        min-height: 100vh;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 40px;
      }

      .barnyard {
        display: flex;
        width: 90%;
        max-width: 1200px;
        gap: 30px;
        align-items: flex-start;
      }

      .pen {
        width: 33.33%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        background-color: rgba(255, 255, 255, 0.8);
        padding: 15px;
        border-radius: 8px;
        box-sizing: border-box;
      }

      .pen-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .pen-item img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 4px;
        cursor: grab;
      }

      .pen-filename {
        font-size: 11px;
        margin-top: 4px;
        color: #333;
        word-break: break-all;
        line-height: 1.2;
      }

      .barn {
        background-image: url("barn.jpg");
        background-size: 100% auto;
        background-position: top center;
        background-repeat: no-repeat;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .drop-zones {
        display: flex;
        gap: 20px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }

      .drop-zone-wrapper {
        display: flex;
        flex-direction: column;
      }

      .drop-zone {
        width: 210px;
        height: 200px;
        border: 2px dashed #007bff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        color: #007bff;
        border-radius: 8px;
        padding: 10px;
        box-sizing: border-box;
        font-size: 14px;
        position: relative;
        overflow: hidden;
        background-color: #fff;
      }

      /* Third Drop Zone specific styles: matches input box width (440px) and input text box height initially */
      .drop-zone-wide {
        width: 440px;
        height: 48px;
        border: 2px dashed #007bff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        color: #007bff;
        border-radius: 8px;
        padding: 10px;
        box-sizing: border-box;
        font-size: 14px;
        position: relative;
        overflow: hidden;
        background-color: #fff;
        transition:
          height 0.3s ease,
          border-color 0.3s ease;
      }

      .drop-zone-input {
        width: 100%;
        height: 38px;
        padding: 8px 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-family: inherit;
        font-size: 13px;
      }

      .drop-zone.dragover {
        background-color: #82aed3;
      }
      .drop-zone.has-file {
        border-color: #28a745;
        border-style: solid;
      }

      .thumb-preview {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      .zone-text {
        z-index: 1;
        pointer-events: none;
      }

      .db-select-container,
      .search-container {
        width: 440px;
        margin-bottom: 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .db-select-container label,
      .search-container label {
        font-weight: bold;
        font-size: 14px;
        color: #333;
      }

      #databaseSelect,
      #searchInput {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
        background-color: #fff;
        box-sizing: border-box;
      }

      #databaseSelect {
        cursor: pointer;
      }

      #sendBtn {
        width: 440px;
        padding: 15px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 20px;
        transition: background 0.2s;
      }
      #sendBtn:hover {
        background-color: #0056b3;
      }
      #sendBtn:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }

      #response {
        width: 440px;
        min-height: 80px;
        padding: 10px;
        border: 1px solid #ccc;
        background: #f9f9f9;
        border-radius: 4px;
        white-space: pre-wrap;
        word-break: break-all;
        font-family: monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="barnyard">
      <div class="pen" id="penContainer"></div>

      <div class="barn">
        <!-- Dynamic container for drop zone wrappers -->
        <div class="drop-zones" id="zones"></div>

        <div class="db-select-container">
          <label for="databaseSelect">Select Database:</label>
          <select id="databaseSelect">
            <option value="orthodb">orthodb</option>
            <option value="ncbi">ncbi</option>
          </select>
        </div>

        <div class="search-container">
          <label for="searchInput">Search Query:</label>
          <input
            type="text"
            id="searchInput"
            placeholder="Enter search term..."
          />
        </div>

        <button id="sendBtn" disabled>Send Query</button>

        <div>
          <input type="checkbox" id="collapseOrthogroupsCheckbox" /><label
            >Collapse Orthogroups</label
          >
          <div id="response">Server response will show here...</div>
        </div>
      </div>
    </div>

    <script>
            // Lightweight DOM creation helper
            const html = ["div", "span", "input"].reduce((acc, tag) => {
              acc[tag] = (props = {}, children = []) => {
                const el = document.createElement(tag);
                Object.entries(props).forEach(([k, v]) => {
                  if (k === "class") el.className = v;
                  else el[k] = v;
                });
                (Array.isArray(children) ? children : [children]).forEach((c) => {
                  if (c)
                    el.appendChild(
                      typeof c === "string" ? document.createTextNode(c) : c,
                    );
                });
                return el;
              };
              return acc;
            }, {});

            const uploadedFiles = {
              image1: null,
              image2: null,
              imageX: null,
              database: "orthodb",
              search: "",
            };

      function collapseOrthogroups(dbResults) {
        if (!dbResults) return {};

        const stopWords = new Set([
          'a', 'an', 'and', 'are', 'as', 'at', 'be', 'by', 'for', 'from',
          'has', 'he', 'in', 'is', 'it', 'its', 'of', 'on', 'that', 'the',
          'to', 'was', 'were', 'will', 'with', 'protein',
          'isoform', 'like', 'type', 'putative', 'member', 'family'
        ]);

        const processed = {};
        for (const [ogId, speciesMap] of Object.entries(dbResults)) {
          const wordCounts = {};
          const speciesCounts = [];

          Object.entries(speciesMap).forEach(([speciesName, genes], i) => {
            if (!Array.isArray(genes)) return;
            speciesCounts[i] = genes.length;

            for (const gene of genes) {
              if (!gene.description) continue;

              const words = gene.description
                .toLowerCase()
                .replace(/[^a-z0-9\s-]/g, ' ')
                .split(/\s+/);

              for (const word of words) {
                if (word.length > 2 && !stopWords.has(word) && isNaN(word)) {
                  wordCounts[word] = (wordCounts[word] || 0) + 1;
                }
              }
            }
          });

          const sortedWords = Object.entries(wordCounts)
            .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
            .map(([word]) => word);

          const summaryText = `(${speciesCounts.join(', ')}) ` + (
            sortedWords.length > 0 ? sortedWords.join(', ') : 'No descriptive terms found'
          );

          processed[ogId] = {
            summary: summaryText,
            raw: speciesMap
          };
        }

        return processed;
      }



      const renderCurrentData = () => {
        if (!window.currentData || !window.currentData.dbResults) return;
        const res = document.getElementById('response');
        res.innerHTML = ''; // Clear previous text output

        const globalCollapsed = document.getElementById('collapseOrthogroupsCheckbox').checked;

        if (!globalCollapsed) {
          // Show raw JSON output as normal
          const pre = document.createElement('pre');
          pre.textContent = JSON.stringify(window.currentData, null, 2);
          res.appendChild(pre);
          return;
        }

        // Generate collapsed summaries with individual toggle checkboxes
        const collapsedData = collapseOrthogroups(window.currentData.dbResults);

        const container = document.createElement('div');
        container.style.display = 'flex';
        container.style.flexDirection = 'column';
        container.style.gap = '12px';

        for (const [ogId, { summary, raw }] of Object.entries(collapsedData)) {
          const card = document.createElement('div');
          card.style.border = '1px solid #ddd';
          card.style.borderRadius = '4px';
          card.style.padding = '8px';
          card.style.backgroundColor = '#fff';

          // Header row with Orthogroup ID and Uncollapse checkbox
          const header = document.createElement('div');
          header.style.display = 'flex';
          header.style.alignItems = 'center';
          header.style.gap = '10px';
          header.style.marginBottom = '6px';

          const title = document.createElement('strong');
          title.textContent = ogId;

          const label = document.createElement('label');
          label.style.fontSize = '11px';
          label.style.cursor = 'pointer';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.style.marginRight = '4px';

          label.appendChild(checkbox);
          label.appendChild(document.createTextNode('Uncollapse this'));

          header.appendChild(title);
          header.appendChild(label);

          // Content container (Summary view vs Raw JSON view)
          const content = document.createElement('div');
          content.className = 'og-content';
          content.textContent = summary;

          // Toggle content view on checkbox change
          checkbox.addEventListener('change', (e) => {
            if (e.target.checked) {
              content.innerHTML = `<pre style="margin: 0; font-size: 11px; white-space: pre-wrap;">${JSON.stringify(raw, null, 2)}</pre>`;
            } else {
              content.textContent = summary;
            }
          });

          card.appendChild(header);
          card.appendChild(content);
          container.appendChild(card);
        }

        res.appendChild(container);
      };


            window.onload = () => {
              const zonesContainer = document.getElementById("zones");

              [1, 2, /*"X"*/].forEach((n) => {
                const storageKey = "image" + n;
                const isOptional = n === "X";

                const fileInput = html.input({
                  type: "file",
                  id: "fileInput" + n,
                  accept: "image/*",
                  style: "display:none",
                });

                const textInput = html.input({
                  type: "text",
                  class: "drop-zone-input",
                  id: "textInput" + n,
                  placeholder: `Species ${n} name or drop image...`,
                });

                const dropZone = html.div(
                  {
                    class: n == "X" ? "drop-zone-wide" : "drop-zone",
                    id: "zone" + n,
                  },
                  [
                    html.span({ class: "zone-text" }, [
                      `Drop image ${n} here${isOptional ? " (Optional)" : ""} or click`,
                    ]),
                  ],
                );

                zonesContainer.appendChild(
                  html.div({ class: "drop-zone-wrapper" }, [
                    dropZone,
                    textInput,
                    fileInput,
                  ]),
                );

                setupZone(dropZone, fileInput, textInput, storageKey);
              });

              // Load pen images from pictures.json
              fetch("pictures.json")
                .then((x) => x.json())
                .then((pictures) => loadPenImages(pictures))
                .catch((err) => console.error("Could not load pictures.json:", err));
            };

            document
              .getElementById("databaseSelect")
              .addEventListener("change", (e) => {
                uploadedFiles.database = e.target.value;
              });

            document.getElementById("searchInput").addEventListener("input", (e) => {
              uploadedFiles.search = e.target.value;
            });

            function setupZone(zone, fileInput, textInput, storageKey) {
              zone.addEventListener("click", () => fileInput.click());
              zone.addEventListener("dragover", (e) => {
                e.preventDefault();
                zone.classList.add("dragover");
              });
              zone.addEventListener("dragleave", () =>
                zone.classList.remove("dragover"),
              );

              zone.addEventListener("drop", (e) => {
                e.preventDefault();
                zone.classList.remove("dragover");

                if (e.dataTransfer.files.length) {
                  processFile(e.dataTransfer.files[0], zone, textInput, storageKey);
                  return;
                }

                const imageSrc = e.dataTransfer.getData("text/plain");
                if (imageSrc) {
                  processPenImage(imageSrc, zone, textInput, storageKey);
                }
              });

              fileInput.addEventListener("change", () => {
                if (fileInput.files.length)
                  processFile(fileInput.files[0], zone, textInput, storageKey);
              });

              textInput.addEventListener("input", () => {
                clearZoneVisuals(zone);

                if (!uploadedFiles[storageKey]) {
                  uploadedFiles[storageKey] = {};
                }
                uploadedFiles[storageKey].species = textInput.value;
                uploadedFiles[storageKey].fileData = null;

                updateButtonState();
              });
            }

            function processFile(file, zoneElement, textInputElement, storageKey) {
              if (!file.type.startsWith("image/")) {
                document.getElementById("response").innerText =
                  "Error: Dropped file must be an image.";
                return;
              }

              const reader = new FileReader();
              reader.onload = function () {
                uploadedFiles[storageKey] = {
                  fileName: file.name,
                  fileData: reader.result,
                };
                updateZoneVisuals(zoneElement, reader.result);
              };
              reader.readAsDataURL(file);
            }

            async function processPenImage(
              imageSrc,
              zoneElement,
              textInputElement,
              storageKey,
            ) {
              try {
                const fileName = imageSrc.split("/").pop();
                const decodedName = decodeURIComponent(fileName);
                const scientificName = stripExtension(decodedName).split(' ').slice(0,2).join(' ');
                uploadedFiles[storageKey] = {
                  fileName: fileName,
                  fileData: imageSrc,
                  species: scientificName,
                };

                textInputElement.value = scientificName;
                updateZoneVisuals(zoneElement, imageSrc);
              } catch (error) {
                document.getElementById("response").innerText =
                  `Error loading pen image: ${error.message}`;
              }
            }

            function updateZoneVisuals(zoneElement, dataUrl) {
              zoneElement.classList.add("has-file");

              const oldImg = zoneElement.querySelector(".thumb-preview");
              if (oldImg) oldImg.remove();

              const img = document.createElement("img");
              img.src = dataUrl;
              img.className = "thumb-preview";
              zoneElement.appendChild(img);

              const textSpan = zoneElement.querySelector(".zone-text");
              if (textSpan) textSpan.style.display = "none";

              updateButtonState();
            }

            function clearZoneVisuals(zoneElement) {
              zoneElement.classList.remove("has-file");
              const oldImg = zoneElement.querySelector(".thumb-preview");
              if (oldImg) oldImg.remove();

              const textSpan = zoneElement.querySelector(".zone-text");
              if (textSpan) textSpan.style.display = "block";
            }

            function updateButtonState() {
              const sendBtn = document.getElementById("sendBtn");

              const valid1 =
                uploadedFiles.image1 &&
                (uploadedFiles.image1.fileData ||
                    uploadedFiles.image1.species);
              const valid2 =
                uploadedFiles.image2 &&
                (uploadedFiles.image2.fileData ||
                  uploadedFiles.image2.species);

              sendBtn.disabled = !(valid1 && valid2);
            }

            async function sendToServer() {
              const res = document.getElementById("response");
              const sendBtn = document.getElementById("sendBtn");

              res.innerText = "Sending payload to /orthologs...";
              sendBtn.disabled = true;

              try {
                const response = await fetch("/orthologs", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(uploadedFiles),
                });

                const textStream = response.body.pipeThrough(new TextDecoderStream());
                const reader = textStream.getReader();
                let leftovers = '';
                while(true){
                  const { done, value: chunk } = await reader.read();
                  const msgs = (leftovers+(done?'':chunk)).split('\n\n');
                  leftovers = msgs.pop()
                  for(const msgRaw of msgs){
                    let msg;
                    try {
                      msg = JSON.parse(msgRaw);
                    } catch(e) {
                      console.log(msgRaw);
                    }
                    console.log(msg);
                    res.innerText += JSON.stringify(msg, null, 2) + '\n\n';
                    window.lastMsg = msg;
                  }
                  if(done){
                    res.innerText += leftovers;
                    try {
                      window.lastMsg = JSON.parse(leftovers);
                    } catch(e) {
                      console.log(leftovers);
                    }
                    window.currentData = window.lastMsg;
                    renderCurrentData();
                    updateButtonState();
                    return;
                  }
                }
              } catch(e) {
                console.log(e);
                updateButtonState();
                res.innerText += e;
              }
            }

            document
              .getElementById("sendBtn")
              .addEventListener("click", sendToServer);

            document.getElementById("collapseOrthogroupsCheckbox").onclick = renderCurrentData;

            function loadPenImages(imageList) {
              const penDiv = document.getElementById("penContainer");
              penDiv.innerHTML = "";

              imageList.forEach((fileName) => {
                const img = html.input ? document.createElement("img") : null;
                img.src = `pictures/${fileName}`;
                img.alt = fileName.split(".").slice(0, -1).join(".");
                img.draggable = true;
                img.addEventListener("dragstart", (e) => {
                  e.dataTransfer.setData("text/plain", img.src);
                });

                //const label = html.span({ class: "pen-filename" }, [fileName]);
                const item = html.div({ class: "pen-item" }, [img, /*label*/]);

                penDiv.appendChild(item);
              });
            }

            function stripExtension(n){
              return n.split('.').slice(0,-1).join('.');
            }
    </script>
  </body>
</html>
