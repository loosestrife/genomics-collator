[project]
name = "py-server"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.12, <3.14"
dependencies = [
    "duckdb (>=1.5.5,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "torch (>=2.13.0,<3.0.0)",
    "torchvision (>=0.28.0,<0.29.0)",
    "pybioclip (>=2.1.5,<3.0.0)",
    "ollama (>=0.6.2,<0.7.0)",
    "uvicorn (>=0.52.3,<0.53.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "torch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "torch"}
torchvision = {source = "torch"}

[tool.pyrefly]
python_executable = ".venv/bin/python"
