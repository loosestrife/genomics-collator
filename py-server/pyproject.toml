[project]
name = "py-server"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.12, <3.14"

# Standard PEP 621 dependencies (Pixi reads these automatically if using pixi's pyproject setup)
dependencies = [
    "duckdb>=1.5.5,<2.0.0",
    "fastapi>=0.141.1,<0.142.0",
    "torch>=2.13.0,<3.0.0",
    "torchvision>=0.28.0,<0.29.0",
    "pybioclip>=2.1.5,<3.0.0",
    "ollama>=0.6.2,<0.7.0",
    "uvicorn>=0.52.3,<0.53.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]
start = "python main.py"

# PyTorch CPU explicit mapping via PyPI index (replaces [[tool.poetry.source]])
[tool.pixi.pypi-dependencies]
duckdb = ">=1.5.5, <2.0.0"
fastapi = ">=0.141.1, <0.142.0"
pybioclip = ">=2.1.5, <3.0.0"
ollama = ">=0.6.2, <0.7.0"
uvicorn = ">=0.52.3, <0.53.0"

torch = { version = ">=2.13.0, <3.0.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.28.0, <0.29.0", index = "https://download.pytorch.org/whl/cpu" }